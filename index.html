<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Xtreme IPTV V2</title>
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    cast-media-player {
      --bottom-controls-visibility: hidden;
    }
  </style>
</head>
<body>
  <cast-media-player></cast-media-player>
  <script>
    (function () {
      try {
        var context = cast.framework.CastReceiverContext.getInstance();
        var NS = 'urn:x-cast:com.xtreme.iptv.resolution';

        context.addCustomMessageListener(NS, function (event) {
          try {
            var data = event.data;
            if (typeof data === 'string') { try { data = JSON.parse(data); } catch(e) {} }
            if (!data || data.type !== 'CHECK_RESOLUTION') return;

            // ✅ قراءة دقة الشاشة الحقيقية (بدلاً من قدرات المعالج)
            var screenW = 0;
            var screenH = 0;
            try { 
              screenW = window.screen.width || 0; 
              screenH = window.screen.height || 0; 
            } catch(e) {}

            var maxRes = '720p'; // افتراضي آمن
            if (screenW >= 3840 || screenH >= 2160) {
              maxRes = '4K';
            } else if (screenW >= 1920 || screenH >= 1080) {
              maxRes = '1080p';
            } else if (screenW >= 1280 || screenH >= 720) {
              maxRes = '720p';
            } else {
              maxRes = 'SD';
            }

            // فحص ترميزات الصوت
            var supportsAAC = true, supportsAC3 = false, supportsEAC3 = false, supportsDTS = false;
            try {
              if (typeof MediaSource !== 'undefined' && MediaSource.isTypeSupported) {
                supportsAAC = MediaSource.isTypeSupported('audio/mp4; codecs="mp4a.40.2"');
                supportsAC3 = MediaSource.isTypeSupported('audio/mp4; codecs="ac-3"');
                supportsEAC3 = MediaSource.isTypeSupported('audio/mp4; codecs="ec-3"');
                supportsDTS = MediaSource.isTypeSupported('audio/mp4; codecs="dtsc"');
              }
            } catch (e) {}

            var response = JSON.stringify({
              type: 'RESOLUTION_RESPONSE',
              maxResolution: maxRes,
              supportsAAC: supportsAAC,
              supportsAC3: supportsAC3,
              supportsEAC3: supportsEAC3,
              supportsDTS: supportsDTS
            });
            
            context.sendCustomMessage(NS, event.senderId, response);
          } catch(e) {}
        });

        context.start();
      } catch(e) {
        try { cast.framework.CastReceiverContext.getInstance().start(); } catch(e2) {}
      }
    })();
  </script>
</body>
</html>
