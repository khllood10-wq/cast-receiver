<script>
  const context = cast.framework.CastReceiverContext.getInstance();
  const CUSTOM_NAMESPACE = 'urn:x-cast:com.xtreme.iptv.resolution';

  context.addCustomMessageListener(CUSTOM_NAMESPACE, function(customEvent) {
    // 🛑 اختبار: تحويل الشاشة للأحمر عند استلام أي رسالة
    document.body.style.backgroundColor = "red";
    console.log("🎉 التلفاز استلم الرسالة من الهاتف!");

    // 🛑 اختبار: إرسال رد وهمي بقيمة "TEST_4K"
    const mockResponse = JSON.stringify({
      type: 'RESOLUTION_RESPONSE',
      maxResolution: 'TEST_4K',
      supportsAAC: true,
      supportsAC3: true,
      supportsEAC3: true,
      supportsDTS: true
    });

    try {
      customEvent.sender.send(mockResponse);
      console.log("🎉 التلفاز أرسل الرد الوهمي!");
    } catch (e) {
      console.log("❌ فشل إرسال الرد: " + e.message);
    }
  });

  context.start();
</script>
