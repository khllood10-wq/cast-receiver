<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Xtreme IPTV Receiver V2</title>
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    cast-media-player {
      --bottom-controls-visibility: hidden;
      --progress-bar-color: transparent;
      --splash-image: "";
    }
    /* صندوق الاختبار الأحمر */
    #debug-box {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-color: red; display: none; z-index: 999999;
      justify-content: center; align-items: center; color: white; font-size: 60px; font-family: sans-serif; text-align: center;
    }
  </style>
</head>
<body>
  <cast-media-player></cast-media-player>
  <div id="debug-box">MESSAGE RECEIVED!</div>
  <script>
    const context = cast.framework.CastReceiverContext.getInstance();
    const CUSTOM_NAMESPACE = 'urn:x-cast:com.xtreme.iptv.resolution';
    
    context.addCustomMessageListener(CUSTOM_NAMESPACE, function(customEvent) {
      // إظهار الصندوق الأحمر
      document.getElementById('debug-box').style.display = 'flex';
      console.log("Message received: ", customEvent.data);
      
      try {
        customEvent.sender.send(JSON.stringify({
          type: 'RESOLUTION_RESPONSE',
          maxResolution: 'TEST_4K',
          supportsAAC: true,
          supportsAC3: true,
          supportsEAC3: true,
          supportsDTS: true
        }));
      } catch(e) {}
    });

    context.start();
  </script>
</body>
</html>
