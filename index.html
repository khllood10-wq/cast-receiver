<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Xtreme IPTV Receiver V2</title>
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    cast-media-player {
      --bottom-controls-visibility: hidden;
      --progress-bar-color: transparent;
      --splash-image: "";
    }
    /* صندوق الاختبار */
    #debug-box {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-color: red; display: none; z-index: 999999;
      flex-direction: column; justify-content: center; align-items: center; color: white; font-family: sans-serif; text-align: center;
    }
    .title { font-size: 60px; margin-bottom: 20px; }
    .status { font-size: 40px; background: black; padding: 20px; border-radius: 10px; }
  </style>
</head>
<body>
  <cast-media-player></cast-media-player>
  <div id="debug-box">
    <div class="title">MESSAGE RECEIVED!</div>
    <div id="send-status" class="status">Sending Reply...</div>
  </div>
  
  <script>
    const context = cast.framework.CastReceiverContext.getInstance();
    const CUSTOM_NAMESPACE = 'urn:x-cast:com.xtreme.iptv.resolution';
    
    context.addCustomMessageListener(CUSTOM_NAMESPACE, function(customEvent) {
      // إظهار صندوق الاختبار الأحمر
      document.getElementById('debug-box').style.display = 'flex';
      
      try {
        const response = JSON.stringify({
          type: 'RESOLUTION_RESPONSE',
          maxResolution: 'TEST_4K',
          supportsAAC: true
        });
        
        // ✅ الإصلاح هنا: استخدام sendCustomMessage بدلاً من sender.send
        context.sendCustomMessage(CUSTOM_NAMESPACE, customEvent.senderId, response);
        
        document.getElementById('send-status').innerText = "✅ REPLY SENT SUCCESSFULLY!";
        document.getElementById('send-status').style.color = "lightgreen";
      } catch(e) {
        document.getElementById('send-status').innerText = "❌ FAILED TO SEND: " + e.message;
        document.getElementById('send-status').style.color = "yellow";
      }
    });

    context.start();
  </script>
</body>
</html>
