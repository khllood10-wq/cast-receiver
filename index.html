<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Xtreme IPTV V2</title>
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    cast-media-player {
      --bottom-controls-visibility: hidden;
    }
  </style>
</head>
<body>
  <cast-media-player></cast-media-player>
  <script>
    (function () {
      try {
        var context = cast.framework.CastReceiverContext.getInstance();
        var NAMESPACE = 'urn:x-cast:com.xtreme.iptv.resolution';

        context.addCustomMessageListener(NAMESPACE, function (event) {
          try {
            var data = event.data;
            if (typeof data === 'string') {
              try { data = JSON.parse(data); } catch (e) {}
            }
            if (!data || data.type !== 'CHECK_RESOLUTION') return;

            // نرجع دائماً 1080p لأن هذا هو الأكثر أماناً لجميع التلفزيونات
            var response = JSON.stringify({
              type: 'RESOLUTION_RESPONSE',
              maxResolution: '1080p',
              supportsAAC: true,
              supportsAC3: false,
              supportsEAC3: false,
              supportsDTS: false
            });

            try {
              context.sendCustomMessage(NAMESPACE, event.senderId, response);
            } catch (e) {}
          } catch (e) {}
        });

        // أبسط استدعاء ممكن - لا خيارات، لا uiConfig، لا معاملات
        context.start();
      } catch (e) {
        // في حالة فشل الأول، نحاول مرة أخرى بلا حماية
        try {
          cast.framework.CastReceiverContext.getInstance().start();
        } catch (e2) {}
      }
    })();
  </script>
</body>
</html>
