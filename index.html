<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Xtreme IPTV V2</title>
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    cast-media-player {
      --bottom-controls-visibility: hidden;
      --progress-bar-color: transparent;
      --splash-image: "";
    }
  </style>
</head>
<body>
  <cast-media-player></cast-media-player>
  <script>
    const context = cast.framework.CastReceiverContext.getInstance();
    const CUSTOM_NAMESPACE = 'urn:x-cast:com.xtreme.iptv.resolution';

    context.addCustomMessageListener(CUSTOM_NAMESPACE, function(customEvent) {
      const message = customEvent.data;
      if (message.type === 'CHECK_RESOLUTION') {
        
        let maxRes = '1080p';
        let supportsAAC = true;
        let supportsAC3 = false;
        let supportsEAC3 = false;
        let supportsDTS = false;

        try {
          if (context.canDisplayType('video/mp4', 3840, 2160, 60)) maxRes = '4K';
          else if (!context.canDisplayType('video/mp4', 1920, 1080, 60)) maxRes = '720p';

          if (typeof MediaSource !== 'undefined' && MediaSource.isTypeSupported) {
            supportsAAC = MediaSource.isTypeSupported('audio/mp4; codecs="mp4a.40.2"');
            supportsAC3 = MediaSource.isTypeSupported('audio/mp4; codecs="ac-3"');
            supportsEAC3 = MediaSource.isTypeSupported('audio/mp4; codecs="ec-3"');
            supportsDTS = MediaSource.isTypeSupported('audio/mp4; codecs="dtsc"');
          }
        } catch(e) {}

        customEvent.sender.send({
          type: 'RESOLUTION_RESPONSE',
          maxResolution: maxRes,
          supportsAAC: supportsAAC,
          supportsAC3: supportsAC3,
          supportsEAC3: supportsEAC3,
          supportsDTS: supportsDTS
        });
      }
    });

    context.start();
  </script>
</body>
</html>
