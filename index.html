<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Xtreme IPTV V2</title>
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    cast-media-player {
      --bottom-controls-visibility: hidden;
    }
  </style>
</head>
<body>
  <cast-media-player></cast-media-player>
  <script>
    (function () {
      try {
        var context = cast.framework.CastReceiverContext.getInstance();
        var NS = 'urn:x-cast:com.xtreme.iptv.resolution';

        context.addCustomMessageListener(NS, function (event) {
          try {
            var data = event.data;
            if (typeof data === 'string') { try { data = JSON.parse(data); } catch(e) {} }
            if (!data || data.type !== 'CHECK_RESOLUTION') return;

            // إرسال 1080p دائماً (لأن التلفاز 1080p، ولحماية الكاست)
            var response = JSON.stringify({
              type: 'RESOLUTION_RESPONSE',
              maxResolution: '1080p',
              supportsAAC: true,
              supportsAC3: false,
              supportsEAC3: false,
              supportsDTS: false
            });
            context.sendCustomMessage(NS, event.senderId, response);
          } catch(e) {}
        });

        context.start();
      } catch(e) {
        try { cast.framework.CastReceiverContext.getInstance().start(); } catch(e2) {}
      }
    })();
  </script>
</body>
</html>
